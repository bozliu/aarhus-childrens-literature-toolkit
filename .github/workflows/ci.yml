name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/python-core.txt
          python -m pip install -e .
      - name: Python smoke
        run: |
          python -m childlit_toolkit smoke
          python -m py_compile childlit_toolkit/pipeline.py childlit_toolkit/cli.py inst/python/build_assets.py

  r-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - name: Parse R entrypoints and targets
        run: |
          Rscript -e "parse(file='scripts/bootstrap.R'); parse(file='scripts/run_targets.R'); parse(file='scripts/render_readme.R'); parse(file='scripts/render_report.R'); parse(file='_targets.R')"
          Rscript -e "source('R/utils.R'); source('R/manifests.R'); source('R/legacy.R'); source('R/modern.R'); source('R/reporting.R'); cat('R source load ok\n')"

  macos-dual-runtime-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - name: Python install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/python-core.txt
          python -m pip install -e .
      - name: Cross-language surface check
        run: |
          python -m childlit_toolkit smoke
          Rscript -e "source('R/utils.R'); cat('R + Python interface files are present\n')"
