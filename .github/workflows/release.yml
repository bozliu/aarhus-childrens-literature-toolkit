name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/python-core.txt
          python -m pip install -e .
      - name: Build release bundle
        run: |
          python -m childlit_toolkit all
          tar -czf aarhus-childlit-release-bundle.tar.gz README.md docs results data/manifests
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            aarhus-childlit-release-bundle.tar.gz
            README.md
            docs/index.html
            results/assets/hero.gif
            results/assets/hero.mp4
            results/tables/benchmark_overview.csv
            results/tables/benchmark_sota_comparison.csv
            results/tables/release_bundle_manifest.csv
