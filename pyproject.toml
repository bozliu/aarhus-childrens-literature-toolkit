[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "childlit-toolkit"
version = "0.1.0"
description = "Dual-runtime Aarhus children's literature analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Bozhong Liu", email = "bozliu@example.com" }
]
dependencies = []

[project.scripts]
childlit-toolkit = "childlit_toolkit.cli:main"

[tool.setuptools]
packages = ["childlit_toolkit"]
